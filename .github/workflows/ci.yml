name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  server-tests:
    name: Server tests (incl. RFC vectors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run tests
        run: cd server && npm test

  web-build:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install & build
        run: cd web && npm ci && npm run build
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          retention-days: 7

  docker-smoke:
    name: Docker image smoke test (run + curl)
    runs-on: ubuntu-latest
    needs: [server-tests, web-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t 2fa-hub:smoke .
      - name: Run container & probe
        run: |
          docker run -d --name smoke -p 127.0.0.1:8123:8000 2fa-hub:smoke
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8123/api/health | grep -q '"ok":true'; then ok=1; break; fi
            sleep 1
          done
          [ "$ok" = 1 ] || { docker logs smoke; exit 1; }
          # SPA 首页 + 登录页回退 + 注册 API（验证写入 /data 权限正常）
          curl -sf -o /dev/null http://127.0.0.1:8123/ 
          curl -sf -o /dev/null http://127.0.0.1:8123/vault
          curl -sf -X POST http://127.0.0.1:8123/api/auth/register \
            -H 'Content-Type: application/json' -H 'X-Requested-With: smoke' \
            -d '{"email":"smoke@test.io","password":"password123"}' | grep -q '"is_admin":true'
          echo "smoke ok"

  docker:
    name: Docker build & publish (GHCR)
    # PR 只构建不发布；push 到 main 或打 v* tag 才发布
    needs: [server-tests, web-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=
      - name: Build & push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
